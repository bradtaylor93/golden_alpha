inherits: /workspace/vol_shape_regimes/configs/base.yaml

experiment_name: experiment_hourly

data:
  source: yahoo
  asset: SPY
  period: "730d"
  interval: "1h"
  random_state: 42

volatility:
  method: ewma_std
  rolling_window: 24
  ewma_span: 24

features:
  lookback_window: 120
  modes: ["summary", "quantile", "temporal"]
  quantile_points: 31
  temporal_downsample: 16
  temporal_dct_components: 10
  temporal_acf_lags: 8
  pacf_lags: 5

embedding:
  method: pca
  standardize: true
  pca_variance_threshold: 0.95
  max_components: 20

clustering:
  methods: ["kmeans", "gmm"]
  k_min: 3
  k_max: 6
  random_state: 42
  min_state_occupancy: 0.03
  select_metric: silhouette

transitions:
  markov_order: 1
  fit_second_order: true
  fit_conditional_model: true
  conditional_max_iter: 700

evaluation:
  train_ratio: 0.70
  top_k_accuracy: 2

output:
  base_dir: /workspace/vol_shape_regimes/outputs
